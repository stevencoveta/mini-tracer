[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-tracer"
version = "0.1.0"
description = "A small Python CLI that extracts static call graphs (see .agentic-meta/charter.md)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[project.scripts]
mini-tracer = "mini_tracer.cli:main"

[tool.setuptools]
packages = ["mini_tracer", "mini_tracer.formats"]
package-dir = {"" = "src"}

# -- tool configs used by the agent during verify --
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
respect-gitignore = true
exclude = ["tests/fixtures/syntax_error.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
