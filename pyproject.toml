[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-tracer"
version = "0.1.0"
description = "A small Python CLI that extracts static call graphs (see .agentic-meta/charter.md)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[tool.setuptools]
packages = ["mini_tracer"]
package-dir = {"" = "src"}
